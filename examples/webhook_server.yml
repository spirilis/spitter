listen:
  host: "0.0.0.0"
  port: 9820
alertmanagerURL: http://alertmanager
prometheusURL: http://prometheus
# Every file in this directory is read as one more router document
# addlRouterDir: /etc/spitter/routers.d
routers:
- url: http://my-test-server:9880/dump
  method: POST
  contentType: text/plain
  template: |-
    Status: {{ .Status }}
    Reason: {{ .NotificationReason }}
    Route labels: {{ .RouteLabels }}
    Alertmanager: {{ .ExternalURL }}
    Orig: {{ .OriginalExternalURL }}
    Alerts:
    {{ range .Alerts -}}
      {{ .Status }}:
        labels-
        {{ range $k, $v := .Labels -}}
        {{ $k }}: {{ $v }}
        {{ end -}}
        annotations-
        {{ range $k, $v := .Annotations -}}
        {{ $k }}: {{ $v }}
        {{ end -}}
        Generator: {{ .GeneratorURL }}
        Orig: {{ .OriginalGeneratorURL }}
        ---
    {{- end }}
  matchers:
  - label: severity
    match_re: ".*"
- url: https://receiver.example.com/hook
  method: POST
  contentType: application/json
  # Sent as "Authorization: Bearer <token>".  Use tokenFile to read the token from a file instead, or
  # basicAuth (username and password) to send "Authorization: Basic ...".
  auth:
    token: s3cret
    # tokenFile: /etc/spitter/receiver-token
    # basicAuth:
    #   username: spitter
    #   password: s3cret
  # HTTPS destinations are verified against the system CA roots unless configured otherwise here.
  tls:
    # Trust only this PEM CA bundle instead of the system roots, e.g. for a private CA.
    # caFile: /etc/spitter/receiver-ca.pem
    # Accept any certificate, e.g. from a self-signed endpoint.  This disables verification entirely.
    insecureSkipVerify: false
  template: |-
    {"status": {{ .Status | toJson }}, "alerts": {{ len .Alerts }}}
  matchers:
  - label: severity
    match_re: "critical|warning"
- url: http://my-test-server:9890/dump
  method: POST
  contentType: application/json
  # toJson writes a value as JSON, quotes and escaping included, and takes whole maps too.  Never put a value between
  # quotes yourself ("{{ .Annotations.summary }}"): one quote in the text breaks the payload, and whoever writes the
  # alert's text can then add fields of their own.
  template: |-
    {
      "Status": {{ .Status | toJson }},
      "Alertmanager": {{ .ExternalURL | toJson }},
      "Alerts": [
      {{- range $i, $alert := .Alerts }}{{ if $i }},{{ end }}
        {
          "Status": {{ .Status | toJson }},
          "Labels": {{ .Labels | toJson }},
          "Annotations": {{ .Annotations | toJson }},
          "Prometheus": {{ .GeneratorURL | toJson }}
        }
      {{- end }}
      ]
    }
  matchers:
  - label: severity
    match_re: ".*"
