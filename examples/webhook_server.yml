listen:
  host: "0.0.0.0"
  port: 9820
alertmanagerURL: http://alertmanager
prometheusURL: http://prometheus
addlRouterDir: /
routers:
- url: http://my-test-server:9880/dump
  method: POST
  contentType: text/plain
  template: |-
    Status: {{ .Status }}
    Alertmanager: {{ .ExternalURL }}
    Orig: {{ .OriginalExternalURL }}
    Alerts:
    {{ range .Alerts -}}
      {{ .Status }}:
        labels-
        {{ range $k, $v := .Labels -}}
        {{ $k }}: {{ $v }}
        {{ end -}}
        annotations-
        {{ range $k, $v := .Annotations -}}
        {{ $k }}: {{ $v }}
        {{ end -}}
        Generator: {{ .GeneratorURL }}
        Orig: {{ .OriginalGeneratorURL }}
        ---
    {{- end }}
  matchers:
  - label: severity
    match_re: ".*"
- url: https://receiver.example.com/hook
  method: POST
  contentType: application/json
  # Sent as "Authorization: Bearer <token>".  Use tokenFile to read the token from a file instead, or
  # basicAuth (username and password) to send "Authorization: Basic ...".
  auth:
    token: s3cret
    # tokenFile: /etc/spitter/receiver-token
    # basicAuth:
    #   username: spitter
    #   password: s3cret
  # HTTPS destinations are verified against the system CA roots unless configured otherwise here.
  tls:
    # Trust only this PEM CA bundle instead of the system roots, e.g. for a private CA.
    # caFile: /etc/spitter/receiver-ca.pem
    # Accept any certificate, e.g. from a self-signed endpoint.  This disables verification entirely.
    insecureSkipVerify: false
  template: |-
    {"status": "{{ .Status }}", "alerts": {{ len .Alerts }}}
  matchers:
  - label: severity
    match_re: "critical|warning"
- url: http://my-test-server:9890/dump
  method: POST
  contentType: application/json
  template: |-
    {
      "Status": "{{.Status}}",
      "Alertmanager": "{{.ExternalURL}}",
      "Alerts": [
      {{ $ac := 0 }}{{ range .Alerts }}{{ if $ac }},{{"\n"}}{{ end }}{{ $ac = add1 $ac -}}
        {
          "Status": "{{.Status}}",
          "Labels": {
            {{ $al := 0 }}{{range $k, $v := .Labels}}{{ if $al }},{{ end }}{{ $al = add1 $al -}}
            "{{$k}}": "{{$v}}"
            {{end}}
          },
          "Annotations": {
            {{ $aa := 0 }}{{range $k, $v := .Annotations}}{{ if $aa }},{{ end }}{{ $aa = add1 $aa -}}
            "{{$k}}": "{{$v}}"
            {{end}}
          },
          "Prometheus": "{{ .GeneratorURL }}"
        }{{ end }}
      ]
    }
  matchers:
  - label: severity
    match_re: ".*"
