# Default values for spitter.

replicaCount: 1

image:
  registry: docker.io
  repository: spirilis/spitter
  # Defaults to the chart appVersion.
  tag: ""
  # Pin the image by digest (sha256:...); takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

spitter:
  # Port spitter listens on inside the pod.  With existingConfig, set this to the listen.port in your config file.
  port: 9820

  # Externally reachable base URLs for Alertmanager and Prometheus.  Links inside each alert (externalURL,
  # generatorURL) are rewritten onto these so they work outside the cluster.
  # Required unless existingConfig is used; when it is, a non-empty value overrides the config file.
  alertmanagerURL: ""
  prometheusURL: ""

  # Path serving Prometheus metrics.  With existingConfig, set this to the metrics.path in your config file.
  metricsPath: /metrics

  # Webhook routers rendered into the generated config file; see examples/webhook_server.yml for the format.
  # Pods are rolled automatically when these change.
  routers: []
  # - url: https://receiver.example.com/hook
  #   method: POST
  #   contentType: application/json
  #   template: |-
  #     {"status": "{{ .Status }}", "alerts": {{ len .Alerts }}}
  #   matchers:
  #     - label: severity
  #       match_re: "critical|warning"

  # Store the generated config file in a Secret instead of a ConfigMap.  Use this when the inline routers above
  # carry credentials (auth.token, auth.basicAuth, auth.cookies).
  configInSecret: false

  # Use an existing ConfigMap or Secret that holds the complete spitter config file instead of generating one.
  # routers and configInSecret are ignored when either is set.
  existingConfig:
    configMap: ""
    secret: ""
    key: config.yml

  # Mount an existing ConfigMap or Secret whose keys are each a single router document (YAML or JSON).
  # spitter polls the mounted directory and hot-reloads its routers when the ConfigMap/Secret is edited,
  # no pod restart needed.  Works alongside inline routers and existingConfig.
  additionalRouters:
    configMap: ""
    secret: ""
    mountPath: /etc/spitter/routers.d
    # Polling interval as a Go duration; "0s" disables hot reload.
    watchInterval: 10s

  # Extra command-line arguments for "spitter router".
  extraArgs: []

serviceAccount:
  create: true
  # spitter never talks to the Kubernetes API, so the token is not mounted by default.
  automount: false
  annotations: {}
  # Defaults to the release fullname when create is true, or "default" when it is false.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  port: 80
  # Fixed node port for NodePort/LoadBalancer; leave null to let Kubernetes allocate one.
  nodePort: null
  # Cluster or Local; only applies to NodePort/LoadBalancer.
  externalTrafficPolicy: ""
  # Only apply to LoadBalancer.
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  annotations: {}
  labels: {}
  # Additional ServicePort entries, e.g. for ports exposed by extraContainers.
  extraPorts: []

# Default paths only expose the webhook endpoint (/v4/alertmanager/webhook), keeping /metrics and /healthz internal.
ingress:
  enabled: false
  className: ""
  annotations: {}
  labels: {}
  hosts:
    - host: spitter.example.com
      paths:
        - path: /v4/alertmanager
          pathType: Prefix
  tls: []
  # - secretName: spitter-tls
  #   hosts:
  #     - spitter.example.com

# Gateway API HTTPRoute (gateway.networking.k8s.io/v1).  The Gateway itself is not managed by this chart; its
# listener must allow routes from this release's namespace.
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  # Gateways (and optionally listeners, via sectionName) to attach to.
  parentRefs:
    - name: gateway
      # namespace: gateway-system
      # sectionName: https
  hostnames:
    - spitter.example.com
  # Each rule is passed through as-is (matches, filters, timeouts, ...) with backendRefs pointing at the spitter
  # Service.  An empty list routes everything on the hostnames to spitter.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v4/alertmanager
      # timeouts:
      #   request: 30s

metrics:
  # prometheus-operator PodMonitor scraping spitter.metricsPath on the http port.
  podMonitor:
    enabled: false
    # e.g. release: kube-prometheus-stack, to match your Prometheus podMonitorSelector
    labels: {}
    annotations: {}
    interval: 60s
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
    # Additional podMetricsEndpoints, e.g. for extraContainers.
    extraEndpoints: []

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10

# Container lifecycle hooks.  The image has no shell, so use the native sleep action (Kubernetes 1.30+) to give
# ingress controllers/gateways time to drop a terminating pod before it stops accepting webhooks:
lifecycle: {}
  # preStop:
  #   sleep:
  #     seconds: 5

resources: {}
  # requests:
  #   cpu: 10m
  #   memory: 32Mi
  # limits:
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # Replaces the CPU/memory targets above when set.
  metrics: []
  behavior: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Plain lists of EnvVar / EnvFromSource objects.
env: []
envFrom: []

extraVolumes: []
extraVolumeMounts: []
initContainers: []
extraContainers: []

revisionHistoryLimit: 10
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
