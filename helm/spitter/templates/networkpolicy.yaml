{{- if include "spitter.networkPolicy" . }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spitter.fullname" . }}
  labels:
    {{- include "spitter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spitter.selectorLabels" . | nindent 6 }}
  # Ingress only: spitter's own connections to its destinations are not restricted
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml (concat $np.from $np.extraFrom) | nindent 8 }}
      ports:
        - port: {{ .Values.spitter.port | int }}
          protocol: TCP
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
