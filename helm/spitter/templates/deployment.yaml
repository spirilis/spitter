{{- include "spitter.validate" . }}
{{- $s := .Values.spitter }}
{{- $generated := include "spitter.generateConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spitter.fullname" . }}
  labels:
    {{- include "spitter.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "spitter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or $generated .Values.podAnnotations }}
      annotations:
        {{- if $generated }}
        checksum/config: {{ include "spitter.configFile" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "spitter.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spitter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      # Keeps Service environment variables out of the environment that router templates can read via .Env
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "spitter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - router
            - --config=/etc/spitter/config/config.yml
            {{- if not $generated }}
            {{- with $s.alertmanagerURL }}
            - {{ printf "--alertmanager=%s" . | quote }}
            {{- end }}
            {{- with $s.prometheusURL }}
            - {{ printf "--prometheus=%s" . | quote }}
            {{- end }}
            {{- end }}
            {{- if include "spitter.hasAdditionalRouters" . }}
            - {{ printf "--routers=%s" $s.additionalRouters.mountPath | quote }}
            {{- with $s.additionalRouters.watchInterval }}
            - {{ printf "--routers-watch-interval=%s" (toString .) | quote }}
            {{- end }}
            {{- end }}
            {{- with $s.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $s.port | int }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/spitter/config
              readOnly: true
            {{- if include "spitter.hasAdditionalRouters" . }}
            - name: routers
              mountPath: {{ $s.additionalRouters.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        # Mounted as directories rather than subPath files so that edits propagate into the running pod
        - name: config
          {{- if $generated }}
          {{- if $s.configInSecret }}
          secret:
            secretName: {{ include "spitter.configName" . }}
          {{- else }}
          configMap:
            name: {{ include "spitter.configName" . }}
          {{- end }}
          {{- else if $s.existingConfig.secret }}
          secret:
            secretName: {{ $s.existingConfig.secret }}
            items:
              - key: {{ $s.existingConfig.key }}
                path: config.yml
          {{- else }}
          configMap:
            name: {{ $s.existingConfig.configMap }}
            items:
              - key: {{ $s.existingConfig.key }}
                path: config.yml
          {{- end }}
        {{- if $s.additionalRouters.secret }}
        - name: routers
          secret:
            secretName: {{ $s.additionalRouters.secret }}
        {{- else if $s.additionalRouters.configMap }}
        - name: routers
          configMap:
            name: {{ $s.additionalRouters.configMap }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
